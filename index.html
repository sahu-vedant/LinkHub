<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iReally – Learning Hub</title>
    <!-- Embedded Google Font (Inter) for a clean, consistent sans-serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER: name at top left, search icon at top right ===== -->
    <header class="site-header">
        <div class="header-left">
            <h1 class="site-title" id="siteOwner">iReally</h1>
        </div>
        <div class="header-right">
            <!-- Theme toggle -->
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">
                <span class="theme-icon" id="themeIcon">☀️</span>
            </button>
            <!-- Search icon button (expands on click) -->
            <button class="search-icon" id="searchIconBtn" aria-label="Open search">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <!-- Expanding search bar (hidden by default) -->
            <div class="search-expand" id="searchExpand">
                <input type="text" id="search-input" class="search-input" placeholder="Search websites…" autocomplete="off" aria-label="Search websites">
                <button class="search-close" id="searchClose" aria-label="Close search">×</button>
            </div>
        </div>
    </header>

    <!-- ===== DASHBOARD ===== -->
    <main id="dashboard" class="dashboard" aria-live="polite">
        <!-- All categories and cards are generated by script.js -->
    </main>

    <!-- ===== DATA FILE ===== -->
    <script src="websites.js"></script>
    <!-- ===== APPLICATION LOGIC ===== -->
    <script src="script.js"></script>
</body>
</html>
