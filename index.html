<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <span class="site-owner" id="siteOwner">Learning Hub</span>
        <div class="header-controls">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
            <div class="search-wrapper">
                <button class="search-toggle" id="searchToggle" aria-label="Search">
                    <svg class="search-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </button>
                <div class="search-bar" id="searchBar">
                    <input type="text" id="searchInput" placeholder="Search resources..." aria-label="Search resources" />
                    <button class="search-close" id="searchClose" aria-label="Close search">×</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Dashboard -->
    <main class="dashboard" id="dashboard">
        <!-- Categories and cards will be injected here -->
    </main>

    <!-- No Results Message (hidden by default) -->
    <div class="no-results" id="noResults">
        <p>😕 No resources found</p>
    </div>

    <!-- Custom Cursor Trail (injected by JS) -->
    <div id="cursorTrail"></div>

    <script src="websites.js"></script>
    <script src="script.js"></script>
</body>
</html>
