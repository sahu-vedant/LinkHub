<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal learning-resource dashboard.">
    <title>Links Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="site-header">
            <h1 id="site-title"></h1>

            <label class="search-shell" for="search-input">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input
                    id="search-input"
                    type="search"
                    placeholder="Search resources..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search resources by website name"
                >
                <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden>
                    ×
                </button>
            </label>
        </header>

        <section id="resource-container" class="resource-container" aria-live="polite"></section>
    </main>

    <script src="websites.js"></script>
    <script src="script.js"></script>
</body>
</html>
